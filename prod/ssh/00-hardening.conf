# /etc/ssh/sshd_config.d/00-hardening.conf
# Préfixe 00- : lu en premier, et avec OpenSSH la première valeur lue l'emporte.

# --- Authentification : clé SSH uniquement ---
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# --- Limiter qui peut se connecter ---
AllowUsers lucien

# --- Limiter les tentatives ---
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# --- Désactiver les fonctions inutiles ---
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# --- Couper les sessions inactives (10 min) ---
ClientAliveInterval 300
ClientAliveCountMax 2
